name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:status:publication
      - run: npm run test:delivery
      - run: npm run test:delivery:upgrade
      - run: npm run test:consumer
      - run: npm run build
      - run: npm run build:delivery

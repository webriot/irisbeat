<style>
:root{color-scheme:light dark;--background:light-dark(#f5f7f8,#101417);--foreground:light-dark(#202b30,#e2eaed);--muted:light-dark(#596970,#99a9b1);--card:light-dark(#fff,#171e23);--secondary:light-dark(#edf1f3,#222c33);--border:light-dark(#d9e1e5,#35424a);--primary:light-dark(#245e66,#9bd4d6);--primary-foreground:light-dark(#fff,#142b30);--success:light-dark(#176744,#77d6ab);--success-surface:light-dark(#eaf6ef,#172e27);--destructive:light-dark(#b42e3d,#ff96a0);--warning:light-dark(#825b0a,#eac16f);--info:light-dark(#6357a2,#b4a5ee);--radius:12px;--font-sans:Inter,ui-sans-serif,system-ui,sans-serif;--ring:var(--primary)}

*{box-sizing:border-box}body{margin:0;color:var(--foreground);font:14px/1.5 var(--font-sans);background:transparent}button,input,select{font:inherit}button,a,input,select,summary{-webkit-tap-highlight-color:transparent}button,select,summary{cursor:pointer}button{min-height:40px;padding:8px 13px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--foreground);font-weight:550}button:hover{background:var(--secondary)}button.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}button.quiet{background:transparent;border-color:transparent}button.danger{color:var(--destructive)}button:disabled{opacity:.5;cursor:default}a{color:inherit;text-underline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ring);outline-offset:3px}input,select{border:1px solid var(--border);border-radius:7px;padding:9px 11px;background:var(--card);color:var(--foreground);min-height:40px}select{max-width:100%}h1,h2,p{margin:0}h1{font-size:28px;letter-spacing:-.8px;line-height:1.2;font-weight:650}h2{font-size:16px;font-weight:650}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;border-bottom:1px solid var(--border)}.brand{font-size:20px;letter-spacing:-.6px;font-weight:750;text-decoration:none;display:flex;align-items:center;gap:9px}.mark{color:var(--primary);font-size:24px}nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}nav a{padding:8px 10px;color:var(--muted);text-decoration:none;border-radius:6px}nav a[aria-current=page]{background:var(--secondary);color:var(--foreground);font-weight:600}.page{max-width:1040px;margin:auto;padding:0 0 110px}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:32px 0 24px}.heading-actions{display:flex;gap:6px;align-items:center}.banner{display:flex;gap:12px;align-items:center;padding:18px 20px;border-radius:var(--radius);background:var(--success-surface);color:var(--success);border:1px solid color-mix(in srgb,var(--success) 24%,transparent);margin-bottom:24px}.banner[data-state=down]{color:var(--destructive);background:color-mix(in srgb,var(--destructive) 8%,var(--card));border-color:color-mix(in srgb,var(--destructive) 30%,transparent)}.banner[data-state=maintenance],.banner[data-state=paused],.banner[data-state=unknown]{color:var(--info);background:var(--card);border-color:var(--border)}.banner-symbol{font-size:22px}.ledger{border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}.monitor{padding:18px 20px}.monitor+.monitor{border-top:1px solid var(--border)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.monitor-name{font-size:15px;letter-spacing:-.15px}.grow{flex:1}.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}.status:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}.status[data-state=up]{color:var(--success)}.status[data-state=down]{color:var(--destructive)}.status[data-state=maintenance]{color:var(--info)}.publication{font-size:12px;border:1px solid var(--border);padding:2px 7px;border-radius:4px;color:var(--muted)}.monitor-actions{display:flex;gap:2px;align-items:center}.menu{position:relative}.menu summary{list-style:none;padding:8px 13px;font-size:18px;line-height:22px;border-radius:6px}.menu summary::-webkit-details-marker{display:none}.menu[open] summary{background:var(--secondary)}.menu-items{position:absolute;right:0;top:44px;width:205px;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 30px #0002;z-index:5;padding:5px}.menu-items button{display:block;text-align:left;width:100%;border:0}.history-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;gap:10px;color:var(--muted);font-size:12px}.percentage{font-variant-numeric:tabular-nums;font-weight:600;color:var(--foreground)}.bars{display:grid;grid-template-columns:repeat(90,minmax(0,1fr));gap:3px;list-style:none;padding:0;margin:0}.bar{height:25px;border-radius:2px;background:var(--success);cursor:pointer}.bar.down{background:var(--destructive)}.bar.maintenance{background:var(--info)}.bar.empty{background:var(--secondary)}.bar[aria-current=true]{outline:2px solid var(--foreground);outline-offset:2px}.history-detail{font-size:12px;color:var(--muted);min-height:20px;margin-top:7px}.incidents{margin-top:28px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.empty{color:var(--muted);border-top:1px solid var(--border);padding:18px 0}.incident{border-top:1px solid var(--border);padding:16px 0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.incident time{color:var(--muted);font-size:12px}.incident strong{font-weight:600}.badge{color:var(--destructive);font-size:12px}.badge.recovered{color:var(--success)}.stale{color:var(--warning);font-size:12px}.form-panel{border-radius:var(--radius);border-top:1px solid var(--border);background:var(--secondary);padding:20px}.form-panel h2{margin-bottom:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fields label{display:grid;gap:6px;font-size:13px}.fields .wide{grid-column:1/-1}.form-actions{display:flex;gap:8px;align-items:center;margin-top:20px}.settings{max-width:620px}.settings form{background:var(--card);border:1px solid var(--border);padding:22px;border-radius:var(--radius);margin-bottom:20px}.settings h2{margin-bottom:16px}.settings input{width:100%}.settings label{display:grid;gap:7px}.saved{color:var(--success);font-size:12px}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}.footer a{color:var(--muted)}.prototype-bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100 </style></head><body><div class="page">
<header><a class="brand" href="/" data-view="public"><span class="mark" aria-hidden="true">◉</span>irisbeat</a><nav aria-label="Application"><a href="/" data-view="public">Status page</a><a href="/operator" data-view="operator">Operator</a></nav></header>
<main><div class="heading"><h1 id="title">Webriot Status</h1><div class="heading-actions"><span id="stale" class="stale" role="status" hidden>Updates unavailable</span><button id="new-button" class="primary" hidden>New Monitor</button><button id="settings-button" class="quiet" hidden>Settings</button><button id="back-button" hidden>← Monitors</button></div></div>
<section id="workspace"><section class="banner" id="banner" aria-label="Current status" aria-live="polite"><span class="banner-symbol" aria-hidden="true">✓</span><h2 id="banner-text">All services operational</h2></section><div id="ledger" class="ledger"></div><section class="incidents"><div class="section-head"><h2>Incidents</h2><button id="refresh-button" class="quiet" hidden>↻ Refresh</button></div><div id="incident-list"></div></section></section>
<section class="settings" id="settings" hidden><form id="page-form"><h2>Status page</h2><label>Page name<input name="pageName" maxlength="120" required value="Webriot Status"></label><div class="form-actions"><button class="primary">Save page</button><output class="saved"></output></div></form><form id="webhook-form"><h2>Operator alerts</h2><label>HTTPS webhook URL<input name="webhook" type="url" placeholder="https://" pattern="https://.*"></label><div class="form-actions"><button class="primary">Save webhook</button><output class="saved"></output></div></form></section>
</main><footer class="footer"><a href="https://github.com/Webriot/irisbeat">Source (AGPL-3.0-only)</a><label>Theme <select id="theme" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></footer>
</div><div class="prototype-bar" aria-label="Prototype controls"><strong>Prototype</strong><select id="scenario" aria-label="Simulated live event"><option value="healthy">Operational</option><option value="outage">Incident</option><option value="maintenance">Maintenance</option><option value="unknown">Awaiting check</option><option value="paused">Paused</option><option value="offline">Connection lost</option><option value="recovered">Reconnected</option></select><button id="state-button" class="quiet" aria-expanded="false">State</button></div><pre id="state" class="state-inspector" hidden></pre>
<dialog id="delete-dialog"><h2>Delete Monitor?</h2><p id="delete-description"></p><div class="form-actions"><button id="confirm-delete" class="danger">Delete Monitor</button><button id="cancel-delete">Cancel</button></div></dialog>
<script>
// PROTOTYPE: all writes and live events are in memory. No network or credentials.
const $=id=>document.getElementById(id), escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Instants follow the browser; daily history remains aggregated on UTC boundaries.
const instantFormat=new Intl.DateTimeFormat(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
const bucketDateFormat=new Intl.DateTimeFormat(undefined,{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'});
const browserTimeZone=Intl.DateTimeFormat().resolvedOptions().timeZone;
const formatInstant=value=>instantFormat.format(new Date(value));
const formatBucketDate=value=>bucketDateFormat.format(new Date(value+'T00:00:00Z'));
function localInputValue(value){const date=new Date(value);return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16)}
const labels={up:'Operational',down:'Unavailable',unknown:'Awaiting check',maintenance:'Maintenance',paused:'Monitoring paused'};
const state={view:location.pathname==='/operator'?'operator':'public',pageName:'Webriot Status',theme:'system',scenario:'healthy',connected:true,revision:0,editing:null,selectedDays:{},monitors:[{id:'web',name:'Webriot.com',kind:'http',target:'https://webriot.com',published:true,state:'up',percentage:'100.00%',history:'full'},{id:'api',name:'API',kind:'http',target:'https://api.example.com',published:true,state:'up',percentage:'99.98%',history:'mixed'},{id:'backup',name:'Backup heartbeat',kind:'heartbeat',target:'',published:false,state:'unknown',percentage:null,history:'empty'}],incidents:[]};
let deleteId=null;
const setText=(node,text)=>{if(node.textContent!==text)node.textContent=text};
function inspect(){ $('state').textContent=JSON.stringify({...state,drafts:[...document.querySelectorAll('form')].map(f=>({form:f.id,values:Object.fromEntries(new FormData(f))}))},null,2)}
function navigate(view){state.view=view;state.editing=null;document.querySelectorAll('.form-panel').forEach(n=>n.remove());try{history.replaceState(null,'',(view==='public'?'/':'/operator')+'?variant=ledger'+(view==='settings'?'&view=settings':''))}catch{}render()}
function dayState(m,i){return m.history==='empty'?'empty':i===89&&m.state==='down'?'down':i===89&&m.state==='maintenance'?'maintenance':m.history==='mixed'&&i===32?'down':'up'}
function dayDate(i){const date=new Date();date.setUTCHours(0,0,0,0);date.setUTCDate(date.getUTCDate()-89+i);return date.toISOString().slice(0,10)}
function dayDetail(m,i){const start=new Date(dayDate(i)+'T00:00:00Z');const end=new Date(start.getTime()+86400000);return instantFormat.formatRange(start,end)+' · '+({empty:'No observations',up:'Operational',down:'Failed checks',maintenance:'Maintenance'}[dayState(m,i)])}
function createRow(m){const row=document.createElement('article');row.className='monitor';row.dataset.id=m.id;row.innerHTML=`<div class="row"><h2 class="monitor-name"></h2><span class="publication"></span><span class="grow"></span><span class="status"></span><div class="monitor-actions"><details class="menu"><summary aria-label="Monitor actions">⋯</summary><div class="menu-items"><button data-action="edit">Edit</button><button data-action="maintenance">Declare Maintenance</button><button data-action="publish">Unpublish</button><button data-action="delete" class="danger">Delete</button></div></details></div></div><div class="history-head"><span>90 UTC days</span><span class="percentage"></span></div><ol class="bars" aria-label="Daily availability"></ol><div class="history-detail"></div>`;
const bars=row.querySelector('.bars');for(let i=0;i<90;i++){const bar=document.createElement('li');bar.className='bar';bar.tabIndex=i===89?0:-1;bar.addEventListener('focus',()=>selectDay(m.id,i));bar.addEventListener('click',()=>{selectDay(m.id,i);bar.focus()});bar.addEventListener('keydown',e=>{let target=e.key==='ArrowLeft'?Math.max(0,i-1):e.key==='ArrowRight'?Math.min(89,i+1):e.key==='Home'?0:e.key==='End'?89:null;if(target!==null){e.preventDefault();bars.children[target].focus()}});bars.append(bar)}
row.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(m.id,b.dataset.action));return row}
function selectDay(id,i){state.selectedDays[id]=i;const row=document.querySelector('[data-id="'+id+'"]');if(!row)return;[...row.querySelector('.bars').children].forEach((bar,n)=>{bar.tabIndex=n===i?0:-1;bar.setAttribute('aria-current',String(n===i))});setText(row.querySelector('.history-detail'),dayDetail(state.monitors.find(m=>m.id===id),i));inspect()}
function render(){const operator=state.view!=='public',settings=state.view==='settings';setText($('title'),settings?'Settings':operator?'Monitors':state.pageName);$('workspace').hidden=settings;$('settings').hidden=!settings;$('settings-button').hidden=!operator||settings;$('new-button').hidden=!operator||settings;$('back-button').hidden=!settings;$('refresh-button').hidden=!operator;$('stale').hidden=state.connected;document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.view===(operator?'operator':'public'))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
const monitors=state.monitors.filter(m=>operator||m.published);const status=state.scenario==='paused'?'paused':(monitors.some(m=>m.state==='down')||state.incidents.some(i=>i.open&&monitors.some(m=>m.id===i.monitorId)))?'down':monitors.some(m=>m.state==='unknown')?'unknown':monitors.some(m=>m.state==='maintenance')?'maintenance':'up';$('banner').hidden=operator;$('banner').dataset.state=status;setText($('banner-text'),!monitors.length?'No Monitors published':status==='up'?'All services operational':status==='down'?'Services unavailable':status==='maintenance'?'Some services in Maintenance':labels[status]);setText($('banner').firstElementChild,status==='up'?'✓':status==='down'?'!':'◷');
const visible=new Set(monitors.map(m=>m.id));$('ledger').querySelectorAll('.monitor').forEach(row=>{if(!visible.has(row.dataset.id))row.remove()});for(const m of monitors){let row=$('ledger').querySelector('[data-id="'+m.id+'"]');if(!row){row=createRow(m);$('ledger').append(row)}setText(row.querySelector('.monitor-name'),m.name);const pub=row.querySelector('.publication');pub.hidden=!operator;setText(pub,m.published?'Published':'Private');const statusNode=row.querySelector('.status');statusNode.dataset.state=state.scenario==='paused'?'paused':m.state;setText(statusNode,labels[statusNode.dataset.state]);row.querySelector('.monitor-actions').hidden=!operator;row.querySelector('.menu summary').setAttribute('aria-label','Actions for '+m.name);setText(row.querySelector('[data-action=publish]'),m.published?'Unpublish':'Publish');setText(row.querySelector('[data-action=maintenance]'),m.state==='maintenance'?'End Maintenance':'Declare Maintenance');setText(row.querySelector('.percentage'),m.percentage===null?'No observations':m.percentage);const bars=row.querySelector('.bars');[...bars.children].forEach((bar,i)=>{const cls='bar '+dayState(m,i);if(bar.className!==cls)bar.className=cls;bar.setAttribute('aria-label',dayDetail(m,i))});const selected=state.selectedDays[m.id];setText(row.querySelector('.history-detail'),selected===undefined?formatBucketDate(dayDate(0))+' — '+formatBucketDate(dayDate(89)):dayDetail(m,selected))}
const incidents=state.incidents.filter(i=>operator||state.monitors.some(m=>m.id===i.monitorId&&m.published));const html=incidents.length?incidents.map(i=>`<article class="incident"><span class="badge ${i.open?'':'recovered'}">${i.open?'Open':'Recovered'}</span><strong>${escape(i.name)}</strong><time datetime="${escape(i.at)}">${escape(formatInstant(i.at))}</time></article>`).join(''):'<p class="empty">No Incidents</p>';if($('incident-list').innerHTML!==html)$('incident-list').innerHTML=html;inspect()}
function edit(id){document.querySelectorAll('.form-panel').forEach(n=>n.remove());state.editing=id||'new';const m=state.monitors.find(m=>m.id===id);const form=document.createElement('form');form.id='monitor-editor';form.className='form-panel';form.innerHTML=`<h2>${m?'Edit':'New'} Monitor</h2><div class="fields"><label>Monitor name<input name="name" required maxlength="120" value="${escape(m?.name||'')}"></label><label>Check type<select name="kind" ${m?'disabled':''}><option value="http">HTTP(S)</option><option value="tcp">TCP</option><option value="heartbeat">Heartbeat</option></select></label><label class="wide" id="target-field">Target<input name="target" value="${escape(m?.target||'')}" required></label><label>Interval (seconds)<input name="interval" type="number" min="60" max="86400" value="60" required></label><label>Consecutive successes<input name="recovery" type="number" min="1" max="100" value="2" required></label></div><div class="form-actions"><button class="primary">Save Monitor</button><button type="button" id="cancel-edit">Cancel</button><output class="saved"></output></div>`;
(m?document.querySelector('[data-id="'+id+'"]'):$('ledger')).append(form);form.elements.kind.value=m?.kind||'http';function kindChanged(){const heartbeat=form.elements.kind.value==='heartbeat';$('target-field').hidden=heartbeat;form.elements.target.required=!heartbeat}form.elements.kind.onchange=kindChanged;kindChanged();$('cancel-edit').onclick=()=>{form.remove();state.editing=null;render()};form.onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(form));if(m){m.name=values.name;m.target=values.target}else state.monitors.push({id:'mock-'+Date.now(),name:values.name,kind:values.kind,target:values.target,published:true,state:'unknown',percentage:null,history:'empty'});form.remove();state.editing=null;state.revision++;render()};form.elements.name.focus();inspect()}
function action(id,action){const menu=document.querySelector('[data-id="'+id+'"] .menu');menu.open=false;menu.querySelector('summary').focus();if(action==='edit'){edit(id);return}const m=state.monitors.find(m=>m.id===id);if(action==='delete'){deleteId=id;$('delete-description').textContent=m.name+' will stop checking and leave the Status page. Its Incidents will be retained.';$('delete-dialog').showModal();$('cancel-delete').focus();return}if(action==='publish')m.published=!m.published;if(action==='maintenance'){if(m.state==='maintenance'){m.state='unknown';delete m.maintenanceEndsAt}else{maintenance(id);return}}state.revision++;render()}
function maintenance(id){document.querySelectorAll('.form-panel').forEach(n=>n.remove());const m=state.monitors.find(m=>m.id===id);const form=document.createElement('form');form.id='maintenance-editor';form.className='form-panel';const end=new Date(Date.now()+3600000);const local=localInputValue(end);form.innerHTML=`<h2>Maintenance</h2><div class="fields"><label>End time (${escape(browserTimeZone)})<input name="endsAt" type="datetime-local" required value="${local}"></label></div><div class="form-actions"><button class="primary">Declare Maintenance</button><button type="button">Cancel</button></div>`;document.querySelector('[data-id="'+id+'"]').append(form);form.querySelector('[type=button]').onclick=()=>form.remove();form.onsubmit=e=>{e.preventDefault();m.state='maintenance';m.maintenanceEndsAt=new Date(form.elements.endsAt.value).toISOString();form.remove();state.revision++;render()};form.elements.endsAt.focus()}
function simulate(value){state.scenario=value;state.revision++;if(value==='offline'){state.connected=false;render();return}state.connected=true;const m=state.monitors[0];if(m){m.state=value==='outage'?'down':value==='maintenance'?'maintenance':value==='unknown'?'unknown':'up';m.history=value==='unknown'?'empty':'full';m.percentage=value==='unknown'?null:value==='outage'?'99.97%':'100.00%';if(value==='outage'){state.incidents=[{monitorId:m.id,name:m.name,open:true,at:new Date().toISOString()}]}else if(value==='recovered'||value==='healthy'){state.incidents.forEach(i=>i.open=false)}}render()}
document.querySelectorAll('[data-view]').forEach(a=>a.onclick=e=>{e.preventDefault();navigate(a.dataset.view)});$('settings-button').onclick=()=>navigate('settings');$('back-button').onclick=()=>navigate('operator');$('new-button').onclick=()=>edit(null);$('theme').onchange=e=>{state.theme=e.target.value;document.documentElement.dataset.theme=state.theme;inspect()};$('scenario').onchange=e=>simulate(e.target.value);$('state-button').onclick=()=>{$('state').hidden=!$('state').hidden;$('state-button').setAttribute('aria-expanded',String(!$('state').hidden));inspect()};$('refresh-button').onclick=()=>{state.revision++;render();$('refresh-button').textContent=state.connected?'✓ Updated':'↻ Retry';setTimeout(()=>{$('refresh-button').textContent='↻ Refresh'},1400)};
$('page-form').onsubmit=e=>{e.preventDefault();state.pageName=e.target.elements.pageName.value;setText(e.target.querySelector('output'),'Saved');inspect()};$('webhook-form').onsubmit=e=>{e.preventDefault();state.webhook=e.target.elements.webhook.value;setText(e.target.querySelector('output'),'Saved');inspect()};$('confirm-delete').onclick=()=>{state.monitors=state.monitors.filter(m=>m.id!==deleteId);$('delete-dialog').close();state.revision++;render()};$('cancel-delete').onclick=()=>$('delete-dialog').close();document.addEventListener('input',inspect);document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('details[open]').forEach(d=>d.open=false)});if(new URLSearchParams(location.search).get('view')==='settings')state.view='settings';render();
</script></body></html>

<!doctype html>
<!-- Throwaway, AGPL-3.0-only. Three structures for public Status page and operator configuration.
     Question: ledger, incident-first, or service inspector? No owner decision is recorded.
     Open this file directly; ?variant=A|B|C. No network, storage, build, or dependencies. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irisbeat • owner design options</title>
<style>
:root{color-scheme:light dark;--ink:var(--foreground,light-dark(#182b2a,#e6efec));--subtle:var(--muted-foreground,light-dark(#657572,#a6b8b2));--line:var(--border,light-dark(#d6dfda,#42544d));--paper:var(--card,light-dark(#fff,#182b2a));--soft:var(--secondary,light-dark(#f0f4f1,#233a32));--action:var(--primary,light-dark(#17665e,#75c9b2));--good:var(--success,#47876b);--bad:var(--destructive,#be5548);--warn:var(--warning,#b59034);--maint:var(--chart-4,#7c77ac);--blank:var(--muted-foreground,#c6cfcb);font-family:var(--font-sans,Inter,ui-sans-serif,system-ui,sans-serif);color:var(--ink)}
*{box-sizing:border-box}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button,select{cursor:pointer}button{color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 13px}button:hover,button[aria-pressed=true]{background:var(--soft);border-color:var(--action)}button.primary{background:var(--action);color:var(--paper);border-color:var(--action)}a{color:var(--action)}input,select{color:inherit;background:var(--paper);border:1px solid var(--line);padding:9px;border-radius:5px;max-width:100%}h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.045em;font-weight:620}h2{font-size:20px;letter-spacing:-.02em}h3{font-size:16px}small,.muted{color:var(--subtle);font-size:12px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:24px;border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:750;letter-spacing:-.04em}.brand b{color:var(--action)}.row,.tools,.tabs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.tools{margin:20px 0 30px}.tools label{display:flex;align-items:center;gap:8px;font-size:13px}.tabs{gap:4px}.tabs button{border:0}.frame{max-width:1120px;margin:auto;padding:30px 0 110px}.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}.dot{width:8px;height:8px;background:var(--good);border-radius:50%;display:inline-block;flex-shrink:0}.down .dot{background:var(--bad)}.maintenance .dot{background:var(--maint)}.empty .dot,.paused .dot{background:var(--blank)}.banner{padding:25px 0 28px;border-bottom:1px solid var(--line);margin-bottom:28px}.banner h2{font-size:29px;letter-spacing:-.035em;margin-bottom:12px}.banner .dot{width:12px;height:12px}.section-head{margin:30px 0 16px}.service{padding:22px 0;border-bottom:1px solid var(--line)}.service .between{margin-bottom:14px}.percent{font-variant-numeric:tabular-nums;font-size:14px}.bars{display:flex;gap:3px;align-items:stretch}.bar{flex:1;min-width:1px;border-radius:2px;background:var(--good);height:27px}.bar.down{background:var(--bad)}.bar.degraded{background:var(--warn)}.bar.maintenance{background:var(--maint)}.bar.empty{background:var(--blank);opacity:.45}.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--subtle);margin-top:6px}.legend{gap:15px;margin:18px 0;font-size:11px;color:var(--subtle)}.legend i{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:2px}.incident{padding:17px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:130px 1fr;gap:16px}.incident p{margin-top:7px;font-size:13px;line-height:1.6}.empty-block{padding:50px 0;color:var(--subtle);font-size:18px}.split{display:grid;grid-template-columns:1.6fr 1fr;gap:42px}.side{border-left:1px solid var(--line);padding-left:26px}.focus{border-left:4px solid var(--bad);padding:24px;background:var(--soft);margin-bottom:26px}.focus h2{font-size:30px;margin:12px 0}.focus p{margin:10px 0;font-size:14px;line-height:1.6}.mini-service{padding:16px 0;border-bottom:1px solid var(--line)}.mini-service button{border:0;padding:0;background:none;text-align:left;font-weight:650}.mini-service .bars{margin-top:12px}.mini-service .bar{height:16px}.rail{display:grid;grid-template-columns:235px 1fr;gap:36px;margin-top:25px}.rail nav{border-right:1px solid var(--line);padding-right:20px}.rail nav button{display:block;width:100%;text-align:left;margin-bottom:8px;padding:16px}.rail nav .status{display:flex;margin-top:10px;font-size:12px}.hero-stat{font-size:56px;letter-spacing:-.06em;margin:22px 0 8px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}label.field{display:flex;flex-direction:column;gap:8px;font-size:13px}label.wide{grid-column:1/-1}fieldset{border:0;padding:0;margin:25px 0}legend{font-size:18px;font-weight:650;margin-bottom:8px}.check{display:flex;gap:10px;align-items:center;font-size:14px;margin:20px 0}.notice{margin:15px 0;padding:12px;border-left:3px solid var(--action);background:var(--soft);font-size:13px}.monitor-table{width:100%;border-collapse:collapse;font-size:14px}.monitor-table td,.monitor-table th{text-align:left;padding:16px 8px;border-bottom:1px solid var(--line)}.monitor-table th{font-size:12px;color:var(--subtle);font-weight:500}.monitor-table button{border:0;padding:5px;background:none}.danger{color:var(--bad)}details{margin:28px 0;font-size:12px}summary{cursor:pointer;color:var(--subtle)}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:var(--soft);line-height:1.5}#switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;white-space:nowrap;background:var(--ink);color:var(--paper);border-radius:30px;padding:7px;box-shadow:0 4px 20px #0003;z-index:10;font-size:13px}#switcher button{border:0;background:transparent;color:inherit;border-radius:50%;font-size:20px;padding:5px 13px}#announcement{margin:14px 0;color:var(--action);font-size:14px}.form-stack .form-grid{grid-template-columns:1fr}.form-stack label.wide{grid-column:auto}@media(max-width:720px){.frame{padding:20px 0 110px}.split,.rail{grid-template-columns:1fr;gap:24px}.side{border:0;padding:0}.rail nav{border:0;padding:0;display:flex;overflow:auto}.rail nav button{min-width:160px}.form-grid{grid-template-columns:1fr}.incident{grid-template-columns:1fr;gap:8px}.bars{gap:2px}header{align-items:flex-start}.monitor-table th:nth-child(3),.monitor-table td:nth-child(3){display:none}}
</style>
<div class="frame" id="app"></div>
<nav id="switcher" aria-label="Prototype options"><button id="prev" aria-label="Previous option">←</button><span id="variant-label" aria-live="polite"></span><button id="next" aria-label="Next option">→</button></nav>
<script>
const names={A:'Status ledger',B:'Incident desk',C:'Service inspector'};
const params=new URLSearchParams(location.search);
let variant=names[params.get('variant')]?params.get('variant'):'A';
let surface='public',scenario='outage',selected=1,notice='',pageName='Northstar',authenticated=false;
const monitors=[
{id:1,name:'Website',kind:'HTTP',target:'https://example.com',published:true,interval:60,timeout:10,failures:2,recovery:2,maintenance:false},
{id:2,name:'API',kind:'HTTP',target:'https://api.example.com/health',published:true,interval:60,timeout:10,failures:2,recovery:2,maintenance:true},
{id:3,name:'Backups',kind:'Heartbeat',target:'',published:true,interval:60,timeout:10,failures:2,recovery:2,maintenance:false},
{id:4,name:'Database',kind:'TCP',target:'db.example.com:5432',published:false,interval:60,timeout:10,failures:2,recovery:2,maintenance:false}
];
const incidents=[{id:1,monitor:1,start:'2026-11-13 14:32',end:null},{id:2,monitor:1,start:'2026-11-04 09:14',end:'2026-11-04 09:22'},{id:3,monitor:3,start:'2026-10-22 03:10',end:'2026-10-22 03:21'},{id:4,monitor:4,start:'2026-07-02 12:01',end:'2026-07-02 12:09'},{id:5,monitor:9,start:'2026-06-18 05:44',end:'2026-06-18 06:02'}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function visible(){return monitors.filter(m=>!m.deleted&&(surface==='operator'||m.published)&&!(surface==='public'&&scenario==='empty'))}
function current(m){if(scenario==='paused')return 'paused';if(scenario==='maintenance'||m.maintenance)return 'maintenance';if(m.id===3)return 'empty';if(m.id===1&&['outage','history-error'].includes(scenario)&&!m.recovered)return 'down';return 'up'}
const labels={up:'Operational',down:'Unavailable',maintenance:'Maintenance',empty:'Awaiting first receipt',paused:'Monitoring paused'};
function badge(state){return `<span class="status ${state}"><i class="dot"></i>${labels[state]}</span>`}
function series(m){return Array.from({length:90},(_,i)=>m.id===3?'empty':i<7?'empty':i===20||i===21?'maintenance':i===80?'down':i===70?'degraded':'up')}
function percent(m){const days=series(m),up=days.filter(x=>x==='up').length*1440+days.filter(x=>x==='degraded').length*1432,down=days.filter(x=>x==='down').length*1440+days.filter(x=>x==='degraded').length*8;return up+down?(100*up/(up+down)).toFixed(2)+'%':'Unavailable'}
function bars(m){if(scenario==='history-error')return '<p role="status" class="notice">Bars unavailable</p>';return `<div class="bars" aria-label="90 UTC-day availability bars">${series(m).map((state,i)=>{const date=new Date(Date.UTC(2026,7,16+i)).toISOString().slice(0,10);return `<span class="bar ${state}" role="img" aria-label="${date}: ${state}" title="${date} UTC · ${state}"></span>`}).join('')}</div><div class="axis"><span>16 Aug 2026</span><span>13 Nov 2026 · UTC</span></div>`}
function legend(){return `<div class="row legend">${['up','down','degraded','maintenance','empty'].map((s,i)=>`<span><i style="background:var(--${['good','bad','warn','maint','blank'][i]})"></i>${['Up','Down','Degraded','Maintenance','Empty'][i]}</span>`).join('')}</div>`}
function banner(){const list=visible(),states=list.map(current);return !list.length?'<div class="empty-block">No Monitors published</div>':`<div class="banner"><h2>${scenario==='paused'?'Monitoring paused':states.includes('down')?'Website is unavailable':states.every(s=>s==='maintenance')?'Scheduled Maintenance':states.includes('empty')?'No active outages':'All services operational'}</h2><div class="row between"><span>${esc(pageName)} Status</span><small>13 Nov 2026, 14:46 UTC</small></div></div>`}
function service(m){return `<article class="service"><div class="row between"><h3>${esc(m.name)}</h3>${badge(current(m))}<span class="percent">${scenario==='history-error'?'Unavailable':percent(m)}</span></div>${bars(m)}</article>`}
function incidentList(only){let list=incidents.filter(i=>{const m=monitors.find(m=>m.id===i.monitor);return (!only||i.monitor===only)&&(surface==='operator'||(scenario!=='empty'&&m?.published&&!m.deleted&&i.start>='2026-08-16'))&&(!(!i.end&&(scenario==='healthy'||m?.recovered)))});return `<h2 class="section-head">Incidents${surface==='operator'?' · All dates':''}</h2>${list.length?list.map(i=>{const m=monitors.find(m=>m.id===i.monitor);return `<article class="incident"><small>${i.end?'Recovered':'Open Incident'}</small><div><h3>${esc(m?.name||'Legacy gateway')}${m?.deleted||!m?' · Deleted Monitor':''}</h3><p>${i.start} UTC → ${i.end?i.end+' UTC':'Ongoing'}</p></div></article>`}).join(''):'<p class="empty-block">No Incidents</p>'}`}
function mini(m){return `<article class="mini-service"><div class="row between"><h3>${esc(m.name)}</h3>${badge(current(m))}<span class="percent">${scenario==='history-error'?'Unavailable':percent(m)}</span></div>${bars(m)}</article>`}
function form(m,stack=false){return `<form id="monitor-form" class="${stack?'form-stack':''}"><h2>${esc(m.name)} configuration</h2><div class="form-grid"><label class="field">Name<input name="name" required value="${esc(m.name)}"></label><label class="field">Kind<select name="kind" disabled>${['HTTP','TCP','Heartbeat'].map(k=>`<option ${k===m.kind?'selected':''}>${k}</option>`).join('')}</select></label><label class="field wide">Target<input name="target" value="${esc(m.target)}" placeholder="https://example.com"></label></div>${m.kind==='Heartbeat'?'<fieldset><legend>Watchdog profile</legend><p>Expectation: 60 seconds</p><p>Silence to open: 180 seconds</p><p>Recovery: 2 receipts, at least 60 seconds apart</p></fieldset>':'<fieldset><legend>Check timing</legend>'}${m.kind!=='Heartbeat'?`<div class="form-grid">${[['interval','Interval (seconds)',m.interval],['timeout','Timeout (seconds)',m.timeout],['failures','Failures to open',m.failures],['recovery','Successes to recover',m.recovery]].map(([n,l,v])=>`<label class="field">${l}<input name="${n}" type="number" min="1" required value="${v}"></label>`).join('')}</div><p class="muted">${m.kind==='HTTP'?'HTTP: GET · Any 2xx accepted':'TCP connection check'}</p></fieldset>`:''}<label class="check"><input name="published" type="checkbox" ${m.published?'checked':''}>Publish on Status page</label><div class="row"><button class="primary">Save Monitor</button><button type="button" data-action="maintenance">${m.maintenance?'Replace Maintenance':'Schedule Maintenance'}</button>${m.maintenance?'<button type="button" data-action="end-maintenance">End Maintenance</button>':''}</div>${m.maintenance?'<p class="notice">Maintenance · 13 Nov 2026, 14:00–16:00 UTC</p>':''}<details><summary>Delete Monitor</summary><button type="button" class="danger" data-action="delete">Delete ${esc(m.name)}</button></details></form>`}
function settings(){return `<form id="page-form"><fieldset><legend>Status page</legend><div class="form-grid"><label class="field">Page name<input name="pageName" required value="${esc(pageName)}"></label></div><button>Save page</button></fieldset></form><form id="webhook-form"><fieldset><legend>Operator alerts</legend><div class="form-grid"><label class="field wide">HTTPS webhook<input name="webhook" type="url" placeholder="https://example.com/webhook"></label></div><button>Save webhook</button></fieldset></form>`}
function table(){return `<table class="monitor-table"><thead><tr><th>Monitor</th><th>State</th><th>Publication</th><th></th></tr></thead><tbody>${visible().map(m=>`<tr><td><button data-select="${m.id}">${esc(m.name)}</button></td><td>${badge(current(m))}</td><td>${m.published?'Published':'Private'}</td><td><button data-select="${m.id}" aria-label="Configure ${esc(m.name)}">↗</button></td></tr>`).join('')}</tbody></table>`}
function VariantA(){return surface==='public'?`${banner()}${visible().map(service).join('')}${visible().length?legend()+incidentList():''}`:`<h1>Monitors</h1>${table()}<div class="split section-head"><div>${form(chosen())}</div><aside class="side">${settings()}</aside></div>${incidentList()}`}
function VariantB(){if(surface==='operator')return `<h1>Operations</h1><div class="split section-head"><section>${table()}${incidentList()}</section><aside class="side">${form(chosen(),true)}${settings()}</aside></div>`;const m=visible().find(m=>current(m)==='down');return `${banner()}<div class="split"><section>${m?`<article class="focus"><span class="status down"><i class="dot"></i>Open Incident</span><h2>${esc(m.name)}</h2><p>Unavailable since 13 Nov 2026, 14:32 UTC</p><p>14 minutes ongoing</p></article>`:''}${visible().length?incidentList():''}</section><aside class="side">${visible().map(mini).join('')}${visible().length?legend():''}</aside></div>`}
function chosen(){return visible().find(m=>m.id===selected)||visible()[0]||monitors.find(m=>!m.deleted)}
function VariantC(){const list=visible(),m=chosen();return `${surface==='public'?banner():'<h1>Configuration</h1>'}${list.length?`<div class="rail"><nav aria-label="Monitors">${list.map(x=>`<button data-select="${x.id}" aria-pressed="${m.id===x.id}">${esc(x.name)}${badge(current(x))}</button>`).join('')}${surface==='operator'?'<button data-action="settings">Status page & alerts</button>':''}</nav><section>${surface==='operator'&&selected===0?settings():surface==='operator'?form(m):`<h2>${esc(m.name)}</h2><div class="hero-stat">${scenario==='history-error'?'Unavailable':percent(m)}</div><p class="muted">90 UTC-day availability</p><div style="margin-top:25px">${bars(m)}</div>${legend()}`}${selected!==0?incidentList(m.id):''}</section></div>`:''}`}
function render(){const active=chosen();if(active&&selected!==0)selected=active.id;document.getElementById('app').innerHTML=`<header><div class="brand"><b>◒</b> irisbeat</div><nav class="tabs" aria-label="Surface"><button data-surface="public" aria-pressed="${surface==='public'}">Status page</button><button data-surface="operator" aria-pressed="${surface==='operator'}">Operator</button></nav></header><div class="tools"><label>Example<select id="scenario">${Object.entries({outage:'Outage + Maintenance',healthy:'Recovered',maintenance:'All in Maintenance',empty:'Nothing published','history-error':'History query failed',paused:'Paused context'}).map(([v,l])=>`<option value="${v}" ${v===scenario?'selected':''}>${l}</option>`).join('')}</select></label>${surface==='operator'?'<button data-action="reset">Reset fake data</button>':''}<small>Throwaway prototype</small></div><div id="announcement" role="status">${esc(notice)}</div>${surface==='operator'&&!authenticated?'<form id="auth-form"><h1>Operator</h1><div class="form-grid"><label class="field">Installation secret<input type="password" autocomplete="off" value="prototype-only" aria-label="Installation secret"></label></div><button class="primary">Enter prototype</button></form>':(surface==='operator'&&!monitors.some(m=>!m.deleted)?'<h1>No Monitors</h1>'+settings()+incidentList():({A:VariantA,B:VariantB,C:VariantC}[variant])())}<details><summary>Prototype state</summary><pre>${esc(JSON.stringify({variant,surface,scenario,selectedMonitor:selected,authenticated,pageName,monitors:visible().map(({target,...m})=>m),openIncidents:incidents.filter(i=>!i.end).map(i=>i.id),clock:'2026-11-13T14:46:00Z'},null,2))}</pre></details>`;document.getElementById('variant-label').textContent=`${variant} · ${names[variant]}`}
function cycle(delta){variant=Object.keys(names)[(Object.keys(names).indexOf(variant)+delta+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);window.history.replaceState(null,'',url);render()}

document.getElementById('prev').onclick=()=>cycle(-1);
document.getElementById('next').onclick=()=>cycle(1);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
window.addEventListener('popstate',()=>{variant=names[new URLSearchParams(location.search).get('variant')]?new URLSearchParams(location.search).get('variant'):'A';render()});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){scenario=e.target.value;notice='';render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.surface){surface=b.dataset.surface;notice='';render()}
if(b.dataset.select){selected=Number(b.dataset.select);notice='';render()}
const m=chosen();
if(b.dataset.action==='maintenance'){m.maintenance=true;notice='Maintenance window: 13 Nov 2026, 14:00–16:00 UTC. Existing Incident remains open.';render()}
if(b.dataset.action==='end-maintenance'){m.maintenance=false;notice='Maintenance ended. Consecutive counts reset; open Incident awaits recovery.';render()}
if(b.dataset.action==='delete'){m.deleted=true;notice='Monitor deleted. Checking and publication stopped; Incidents retained for operators.';render()}
if(b.dataset.action==='settings'){selected=0;render()}
if(b.dataset.action==='reset')location.reload();
});
document.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target);
if(e.target.id==='auth-form'){authenticated=true;notice='';render();return}
if(e.target.id==='monitor-form'){const m=chosen();m.name=String(data.get('name'));m.target=String(data.get('target'));m.published=data.has('published');for(const key of ['interval','timeout','failures','recovery'])if(data.has(key))m[key]=Number(data.get(key));notice='Saved in memory. Timing applies to later attempts; Incidents and history are unchanged.'}
if(e.target.id==='page-form'){pageName=String(data.get('pageName'));notice='Status page name saved in memory.'}
if(e.target.id==='webhook-form'){const value=String(data.get('webhook'));if(value&&!value.startsWith('https://')){notice='Webhook must use HTTPS.';render();return}notice=value?'Webhook saved in memory. Operator alerts enabled.':'Operator alerts disabled.'}
render();
});
render();
</script>
</html>
